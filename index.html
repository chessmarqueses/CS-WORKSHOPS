<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=CSM/FY27/WORKSHOPS/Cisco_ACI_Nexus_Dashboard_Workshop_2026.html">
  <title>Cisco ACI & Nexus Dashboard Workshop 2026</title>
  <link rel="canonical" href="CSM/FY27/WORKSHOPS/Cisco_ACI_Nexus_Dashboard_Workshop_2026.html">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0b1f33 0%, #005073 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-block;
      background: rgba(0, 188, 235, 0.2);
      color: #00bceb;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 188, 235, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #00bceb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: #00bceb;
      color: #003853;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 188, 235, 0.3);
    }
    .btn:hover {
      background: #33c9ee;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 188, 235, 0.4);
    }
    .footer-note {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 24px;
      margin-bottom: 0;
    }
  </style>
  <script>
    window.location.replace("CSM/FY27/WORKSHOPS/Cisco_ACI_Nexus_Dashboard_Workshop_2026.html");
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">Cisco Customer Success</div>
    <div class="spinner"></div>
    <h1>Cisco ACI &amp; Nexus Dashboard Workshop</h1>
    <p>Redirecting you to the interactive workshop portal and executive briefing materials...</p>
    <a class="btn" href="CSM/FY27/WORKSHOPS/Cisco_ACI_Nexus_Dashboard_Workshop_2026.html">Click here if not redirected automatically</a>
    <p class="footer-note">Cisco Systems Inc. &bull; Philippines Enterprise</p>
  </div>
</body>
</html>
